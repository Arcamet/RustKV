[package]
name = "rustkv"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A compact persistent network key-value server built for learning systems programming"
license = "MIT"

[dependencies]
crc32fast = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
